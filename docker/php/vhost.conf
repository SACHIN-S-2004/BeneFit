<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Serve assets and includes from outside the document root
    # so bind-mounts don't nest inside ./public on the host
    Alias /assets /var/www/assets

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/assets>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Block direct browser access to PHP includes
    <Directory /var/www/includes>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
